<!DOCTYPE html>
<html lang="zh-CN" class="">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>北宇的小站</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: { colors: { glass: { light: 'rgba(255,255,255,0.45)', dark: 'rgba(30,30,40,0.55)' } } } }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/aplayer/dist/APlayer.min.css">
    <script src="https://cdn.jsdelivr.net/npm/aplayer/dist/APlayer.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/meting@2/dist/Meting.min.js"></script>
    <style>
        body {
            background-image: url('https://images.unsplash.com/photo-1506744626753-1fa44f2ebd58?q=80&w=2000&auto=format&fit=crop');
            background-size: cover; background-position: center; background-attachment: fixed;
            transition: background-image 0.5s ease;
        }
        html.dark body {
            background-image: url('https://images.unsplash.com/photo-1470813740244-df37b8c1edcb?q=80&w=2000&auto=format&fit=crop');
            background-color: #0f172a;
        }
        .glass {
            background: rgba(255, 255, 255, 0.45);
            backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.07);
            transition: background 0.4s ease, border-color 0.4s ease, box-shadow 0.4s ease;
        }
        html.dark .glass {
            background: rgba(30, 30, 50, 0.55);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.4);
        }
        .glass-dark { background: rgba(30, 30, 30, 0.6); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
        html.dark .glass-dark { background: rgba(15, 15, 25, 0.75); }
        .hover-lift { transition: transform 0.3s ease, box-shadow 0.3s ease; }
        .hover-lift:hover { transform: translateY(-3px); box-shadow: 0 12px 40px 0 rgba(31, 38, 135, 0.15); }

        /* 悬浮窗核心样式 */
        #music-widget { transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); transform-origin: bottom right; overflow: hidden; }
        #music-widget.collapsed { width: 56px; height: 56px; border-radius: 50%; padding: 0; display: flex; align-items: center; justify-content: center; cursor: pointer; opacity: 0.9; }
        #music-widget.collapsed:hover { opacity: 1; transform: scale(1.1); }
        #music-widget.collapsed .widget-header { display: none !important; }
        #music-widget.collapsed .widget-content { display: none !important; }
        #music-widget.collapsed .aplayer { display: none !important; }
        #music-widget.collapsed .collapsed-icon { display: block; }
        #music-widget.expanded { width: 85vw; max-width: 350px; height: auto; border-radius: 1.5rem; padding: 0.5rem; }
        #music-widget.expanded .widget-header { display: flex; }
        #music-widget.expanded .widget-content { display: block; }
        #music-widget.expanded .collapsed-icon { display: none; }

        /* APlayer 美化 */
        .aplayer { background: transparent !important; color: #333 !important; font-family: inherit !important; margin: 0 !important; width: 100% !important; }
        html.dark .aplayer { color: #e2e8f0 !important; }
        .aplayer .aplayer-info { border-bottom: none !important; padding: 10px 15px 0 15px !important; }
        .aplayer .aplayer-info .aplayer-music .aplayer-title { font-size: 15px !important; font-weight: bold !important; }
        .aplayer .aplayer-list { max-height: 200px !important; overflow-y: auto !important; margin-top: 5px !important; border-top: 1px solid rgba(150,150,150,0.2) !important; }
        .aplayer .aplayer-list ol li { border-top: none !important; border-bottom: 1px solid rgba(150,150,150,0.1) !important; font-size: 12px !important; padding: 8px 15px !important; }
        .aplayer .aplayer-list ol li.aplayer-list-light { background: rgba(59, 130, 246, 0.15) !important; }
        html.dark .aplayer .aplayer-list ol li.aplayer-list-light { background: rgba(59, 130, 246, 0.3) !important; }
        .aplayer .aplayer-list ol li:hover { background: rgba(255,255,255,0.5) !important; }
        html.dark .aplayer .aplayer-list ol li:hover { background: rgba(255,255,255,0.1) !important; }

        #settings-panel { transition: opacity 0.3s ease, transform 0.3s ease; }
        #settings-panel.hidden-panel { opacity: 0; transform: translateY(-10px); pointer-events: none; }
    </style>
</head>
<body class="min-h-screen text-gray-800 dark:text-gray-100 p-4 md:p-8 transition-colors duration-500">

    <!-- 顶部导航 -->
    <nav class="glass rounded-2xl max-w-6xl mx-auto px-6 py-4 flex flex-wrap justify-between items-center mb-8 sticky top-4 z-50">
        <div class="flex items-center space-x-3">
            <span class="text-xl font-bold tracking-wider">北宇的小站</span>
        </div>
        <div class="hidden md:flex space-x-6 text-sm font-medium">
            <a href="#" onclick="switchTab('home')" class="text-blue-500 hover:text-blue-700 transition">首页</a>
            <a href="#" onclick="switchTab('shuoshuo')" class="hover:text-blue-500 transition">说说</a>
            <a href="#" onclick="switchTab('album')" class="hover:text-blue-500 transition">相册</a>
        </div>
        <div class="flex space-x-4 items-center relative">
            <i id="theme-toggle" class="fas fa-moon cursor-pointer hover:text-blue-500 text-lg transition-colors"></i>
            <i id="settings-btn" class="fas fa-cog cursor-pointer hover:text-blue-500 text-lg transition-colors"></i>
            <div id="settings-panel" class="hidden-panel absolute right-0 top-12 w-72 glass rounded-2xl p-5 z-[60]">
                <div class="flex justify-between items-center mb-4">
                    <h4 class="font-bold text-sm uppercase tracking-wider text-gray-500 dark:text-gray-400">设置</h4>
                    <i id="close-settings" class="fas fa-times cursor-pointer text-gray-400 hover:text-gray-600 dark:hover:text-gray-200"></i>
                </div>
                <div class="space-y-4 text-sm">
                    <div class="flex justify-between items-center">
                        <span>暗色模式</span>
                        <button id="settings-theme-toggle" class="w-10 h-6 rounded-full bg-gray-300 dark:bg-blue-600 relative transition-colors duration-300">
                            <span class="absolute top-0.5 left-0.5 w-5 h-5 rounded-full bg-white shadow transition-transform duration-300 dark:translate-x-4"></span>
                        </button>
                    </div>
                    <!-- 后台管理入口 -->
                    <div class="pt-2 border-t border-gray-200 dark:border-gray-700">
                        <button onclick="switchTab('admin')" class="w-full text-left text-blue-500 hover:text-blue-700 font-medium flex items-center">
                            <i class="fas fa-user-shield mr-2"></i> 后台管理
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <!-- 主内容区 -->
    <main class="max-w-6xl mx-auto">

        <!-- ================= 首页视图 ================= -->
        <div id="home-view" class="block">
            <div class="glass rounded-3xl p-6 flex flex-col items-center justify-center gap-4 mb-6 hover-lift">
                <!-- ★★★ 默认QQ号：1779180196 ★★★ -->
                <img src="https://q1.qlogo.cn/g?b=qq&nk=1779180196&s=100" referrerpolicy="no-referrer" alt="QQ Avatar" class="w-24 h-24 rounded-full border-4 border-white/50 shadow-sm bg-white dark:bg-gray-800">
                <div class="text-center">
                    <h2 class="text-2xl font-bold">北宇</h2>
                    <p class="text-gray-600 dark:text-gray-400 text-sm mt-1">在代码与学术间穿梭的普通人</p>
                </div>
            </div>

            <!-- 公告栏（一言文案） -->
            <div onclick="fetchHitokoto()" title="点击刷新文案" class="glass-dark text-white rounded-3xl p-6 mb-8 flex items-start justify-between text-sm hover-lift cursor-pointer group">
                <div class="flex items-start flex-1 min-w-0">
                    <i class="fas fa-quote-left mr-3 mt-0.5 text-yellow-400 text-lg shrink-0"></i>
                    <span id="hitokoto-text" class="flex-1 break-words">正在获取今日文案...</span>
                </div>
                <i class="fas fa-sync-alt ml-3 mt-0.5 text-gray-400 group-hover:text-white group-hover:rotate-180 transition-all duration-500 shrink-0"></i>
            </div>

            <!-- 快捷入口 -->
            <h3 class="text-xl font-bold mb-4 pl-2 border-l-4 border-blue-500">快捷入口</h3>
            <div class="grid grid-cols-2 gap-6">
                <div onclick="switchTab('shuoshuo')" class="glass rounded-3xl p-8 flex flex-col items-center justify-center hover-lift cursor-pointer group">
                    <div class="w-16 h-16 rounded-full bg-blue-100 dark:bg-blue-900 flex items-center justify-center mb-4 group-hover:scale-110 transition">
                        <i class="fas fa-comment-dots text-3xl text-blue-500"></i>
                    </div>
                    <h4 class="font-bold text-lg">说说</h4>
                    <p class="text-xs text-gray-500 dark:text-gray-400 mt-2">碎碎念与日常记录</p>
                </div>
                <div onclick="switchTab('album')" class="glass rounded-3xl p-8 flex flex-col items-center justify-center hover-lift cursor-pointer group">
                    <div class="w-16 h-16 rounded-full bg-purple-100 dark:bg-purple-900 flex items-center justify-center mb-4 group-hover:scale-110 transition">
                        <i class="fas fa-images text-3xl text-purple-500"></i>
                    </div>
                    <h4 class="font-bold text-lg">相册</h4>
                    <p class="text-xs text-gray-500 dark:text-gray-400 mt-2">留住每一个瞬间</p>
                </div>
            </div>
        </div>

        <!-- ================= 说说视图 ================= -->
        <div id="shuoshuo-view" class="hidden">
            <div class="flex items-center gap-4 mb-6">
                <button onclick="switchTab('home')" class="glass px-4 py-2 rounded-full flex items-center gap-2 hover:bg-white dark:hover:bg-gray-700 transition text-sm text-gray-600 dark:text-gray-300">
                    <i class="fas fa-arrow-left"></i> 返回首页
                </button>
                <h3 class="text-xl font-bold pl-2 border-l-4 border-blue-500">说说</h3>
            </div>
            <!-- 说说列表容器 -->
            <div id="shuoshuo-list" class="space-y-4">
                <!-- 由 JS 动态渲染 -->
            </div>
        </div>

        <!-- ================= 相册视图 ================= -->
        <div id="album-view" class="hidden">
            <div class="flex items-center gap-4 mb-6">
                <button onclick="switchTab('home')" class="glass px-4 py-2 rounded-full flex items-center gap-2 hover:bg-white dark:hover:bg-gray-700 transition text-sm text-gray-600 dark:text-gray-300">
                    <i class="fas fa-arrow-left"></i> 返回首页
                </button>
                <h3 class="text-xl font-bold pl-2 border-l-4 border-blue-500">相册</h3>
            </div>
            <!-- 相册列表容器 -->
            <div id="album-list" class="columns-1 sm:columns-2 md:columns-3 gap-4 space-y-4">
                <!-- 由 JS 动态渲染 -->
            </div>
        </div>

        <!-- ================= 后台管理视图 ================= -->
        <div id="admin-view" class="hidden">
            <div class="flex items-center gap-4 mb-6">
                <button onclick="switchTab('home')" class="glass px-4 py-2 rounded-full flex items-center gap-2 hover:bg-white dark:hover:bg-gray-700 transition text-sm text-gray-600 dark:text-gray-300">
                    <i class="fas fa-arrow-left"></i> 返回首页
                </button>
                <h3 class="text-xl font-bold pl-2 border-l-4 border-red-500">后台管理</h3>
            </div>

            <!-- 登录模块 -->
            <div id="admin-login" class="glass rounded-3xl p-8 max-w-md mx-auto">
                <div class="text-center mb-6">
                    <!-- ★ 修改：把肩膀改成半圆拱形，整体头部和肩部比例更协调 ★ -->
                    <svg class="w-32 h-32 mx-auto mb-4 text-gray-400 dark:text-gray-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                        <!-- 圆润的头部 -->
                        <path d="M12 4.5a4 4 0 1 0 0 8 4 4 0 1 0 0-8Z" />
                        <!-- 半圆拱形的肩膀 (Arc 命令，从左侧画半个圆到右侧) -->
                        <path d="M4.5 20a7.5 7.5 0 0 1 15 0" />
                    </svg>
                    <h4 class="text-lg font-bold">请输入管理员账号密码</h4>
                </div>
                <div class="space-y-4">
                    <input type="text" id="admin-username" placeholder="请输入账号" class="w-full glass border border-gray-300 dark:border-gray-600 rounded-xl px-4 py-3 outline-none focus:border-blue-500 transition bg-transparent">
                    <input type="password" id="admin-password" placeholder="请输入密码" class="w-full glass border border-gray-300 dark:border-gray-600 rounded-xl px-4 py-3 outline-none focus:border-blue-500 transition bg-transparent">
                    <button onclick="handleLogin()" class="w-full bg-blue-500 hover:bg-blue-600 text-white font-bold py-3 rounded-xl transition shadow-lg shadow-blue-500/30">登录后台</button>
                </div>
            </div>

            <!-- 管理主界面（登录成功后显示） -->
            <div id="admin-main" class="hidden">
                <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
                    
                    <!-- 发表说说 -->
                    <div class="glass rounded-3xl p-6">
                        <h4 class="font-bold mb-4 flex items-center"><i class="fas fa-plus-circle text-blue-500 mr-2"></i>发布说说</h4>
                        <textarea id="new-shuoshuo-text" rows="3" placeholder="今天心情怎么样..." class="w-full glass border border-gray-300 dark:border-gray-600 rounded-xl p-3 outline-none focus:border-blue-500 transition bg-transparent mb-3 resize-none"></textarea>
                        <input type="url" id="new-shuoshuo-img" placeholder="配图链接 (可选，如 https://...)" class="w-full glass border border-gray-300 dark:border-gray-600 rounded-xl px-3 py-2 outline-none focus:border-blue-500 transition bg-transparent mb-4 text-sm">
                        <button onclick="addShuoshuo()" class="w-full bg-blue-500 hover:bg-blue-600 text-white font-bold py-2 rounded-xl transition">立即发布</button>
                    </div>

                    <!-- 上传相册 -->
                    <div class="glass rounded-3xl p-6">
                        <h4 class="font-bold mb-4 flex items-center"><i class="fas fa-image text-purple-500 mr-2"></i>添加相册图片</h4>
                        <input type="url" id="new-album-img" placeholder="图片链接 (必填，如 https://...)" class="w-full glass border border-gray-300 dark:border-gray-600 rounded-xl px-3 py-2 outline-none focus:border-purple-500 transition bg-transparent mb-3">
                        <input type="text" id="new-album-desc" placeholder="图片描述 (如：风景与自然)" class="w-full glass border border-gray-300 dark:border-gray-600 rounded-xl px-3 py-2 outline-none focus:border-purple-500 transition bg-transparent mb-4">
                        <button onclick="addAlbum()" class="w-full bg-purple-500 hover:bg-purple-600 text-white font-bold py-2 rounded-xl transition">添加图片</button>
                    </div>

                </div>
                <div class="text-center mt-8">
                    <button onclick="logout()" class="text-red-400 hover:text-red-500 text-sm font-medium"><i class="fas fa-sign-out-alt mr-1"></i> 退出登录</button>
                </div>
            </div>
        </div>

    </main>

    <!-- ================= 悬浮窗音乐播放器 ================= -->
    <div id="music-widget" class="collapsed glass fixed right-4 bottom-20 z-[90] cursor-pointer" onclick="toggleWidget(event)">
        <div class="collapsed-icon text-blue-500 dark:text-blue-400 text-2xl flex items-center justify-center">
            <i class="fas fa-music"></i>
        </div>
        
        <div class="widget-content w-full">
            <div class="widget-header flex justify-between items-center px-4 pt-4 pb-2">
                <span class="text-xs font-bold text-gray-500 dark:text-gray-400 tracking-wider">CLOUD MUSIC</span>
                <i class="fas fa-times cursor-pointer text-gray-400 hover:text-red-400 transition" onclick="toggleWidget(event)"></i>
            </div>
            
            <div class="px-1 pb-1">
                <meting-js
                    api="https://api.injahow.cn/meting/?server=:server&type=:type&id=:id"
                    server="netease" type="playlist" id="3778678" 
                    fixed="false" mini="false" autoplay="false" theme="#3b82f6" loop="all" order="list" preload="auto" mutex="true" lrc-type="0">
                </meting-js>
            </div>
        </div>
    </div>

    <script>
        // ============================================================
        // 1. 数据初始化与渲染逻辑（基于 localStorage）
        // ============================================================
        const DEFAULT_SHuoSHUO = [
            { text: "今天终于把 Cloudflare Pages 部署通了，毛玻璃效果也太好看了吧！🎉", img: "https://images.unsplash.com/photo-1519681393784-d120267933ba?q=80&w=400", time: "5小时前" },
            { text: "代码写累了，发张美图洗洗眼~", img: null, time: "3天前" }
        ];
        const DEFAULT_ALBUM = [
            { src: "https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05?q=80&w=600", desc: "风景与自然" },
            { src: "https://images.unsplash.com/photo-1519681393784-d120267933ba?q=80&w=600", desc: "雪山之夜" },
            { src: "https://images.unsplash.com/photo-1441974231531-c6227db76b6e?q=80&w=600", desc: "森林晨光" },
            { src: "https://images.unsplash.com/photo-1507525428034-b723cf961d3e?q=80&w=600", desc: "夏日海滩" }
        ];

        function initData() {
            if (!localStorage.getItem('blog-shuoshuo')) {
                localStorage.setItem('blog-shuoshuo', JSON.stringify(DEFAULT_SHuoSHUO));
            }
            if (!localStorage.getItem('blog-album')) {
                localStorage.setItem('blog-album', JSON.stringify(DEFAULT_ALBUM));
            }
        }

        function renderShuoshuo() {
            const container = document.getElementById('shuoshuo-list');
            const data = JSON.parse(localStorage.getItem('blog-shuoshuo') || '[]');
            container.innerHTML = '';
            
            if (data.length === 0) {
                container.innerHTML = '<div class="glass rounded-2xl p-6 text-center text-gray-500">暂无说说，去后台添加吧~</div>';
                return;
            }

            data.forEach((item, index) => {
                let html = `
                    <div class="glass rounded-2xl p-6 hover-lift relative group">
                        <div class="flex items-center space-x-3 mb-3">
                            <img src="https://q1.qlogo.cn/g?b=qq&nk=1779180196&s=100" referrerpolicy="no-referrer" class="w-10 h-10 rounded-full bg-white dark:bg-gray-800">
                            <div><div class="font-bold">北宇</div><div class="text-xs text-gray-500 dark:text-gray-400">${item.time}</div></div>
                        </div>
                        <p class="text-gray-700 dark:text-gray-300 text-sm mb-3 whitespace-pre-wrap">${item.text}</p>
                `;
                if (item.img) {
                    html += `<img src="${item.img}" class="rounded-xl max-w-xs w-full object-cover">`;
                }
                html += `<button onclick="deleteShuoshuo(${index})" class="absolute top-4 right-4 text-red-400 opacity-0 group-hover:opacity-100 transition text-sm"><i class="fas fa-trash-alt"></i></button></div>`;
                container.innerHTML += html;
            });
        }

        function renderAlbum() {
            const container = document.getElementById('album-list');
            const data = JSON.parse(localStorage.getItem('blog-album') || '[]');
            container.innerHTML = '';
            
            if (data.length === 0) {
                container.innerHTML = '<div class="glass rounded-2xl p-6 text-center text-gray-500 w-full col-span-3">暂无照片，去后台添加吧~</div>';
                return;
            }

            data.forEach((item, index) => {
                let html = `
                    <div class="glass rounded-2xl overflow-hidden hover-lift break-inside-avoid relative group">
                        <img src="${item.src}" class="w-full" onerror="this.src='https://via.placeholder.com/400x300?text=Image+Error'">
                        <div class="p-3 text-sm text-center text-gray-600 dark:text-gray-400">${item.desc}</div>
                        <button onclick="deleteAlbum(${index})" class="absolute top-2 right-2 bg-black/50 text-white rounded-full w-8 h-8 flex items-center justify-center opacity-0 group-hover:opacity-100 transition"><i class="fas fa-trash-alt text-xs"></i></button>
                    </div>
                `;
                container.innerHTML += html;
            });
        }

        function deleteShuoshuo(index) {
            if(!confirm('确定删除这条说说吗？')) return;
            let data = JSON.parse(localStorage.getItem('blog-shuoshuo') || '[]');
            data.splice(index, 1);
            localStorage.setItem('blog-shuoshuo', JSON.stringify(data));
            renderShuoshuo();
        }
        function deleteAlbum(index) {
            if(!confirm('确定删除这张照片吗？')) return;
            let data = JSON.parse(localStorage.getItem('blog-album') || '[]');
            data.splice(index, 1);
            localStorage.setItem('blog-album', JSON.stringify(data));
            renderAlbum();
        }

        // ============================================================
        // 2. 后台管理逻辑
        // ============================================================
        function handleLogin() {
            const user = document.getElementById('admin-username').value;
            const pass = document.getElementById('admin-password').value;

            // ★★★ 账号 admin，密码 1677554758a ★★★
            if (user === 'admin' && pass === '1677554758a') {
                document.getElementById('admin-login').classList.add('hidden');
                document.getElementById('admin-main').classList.remove('hidden');
                alert('登录成功！');
            } else {
                alert('账号或密码错误！');
            }
        }

        function logout() {
            document.getElementById('admin-login').classList.remove('hidden');
            document.getElementById('admin-main').classList.add('hidden');
            document.getElementById('admin-username').value = '';
            document.getElementById('admin-password').value = '';
            switchTab('home');
        }

        function addShuoshuo() {
            const text = document.getElementById('new-shuoshuo-text').value.trim();
            const img = document.getElementById('new-shuoshuo-img').value.trim();
            if (!text) return alert('请输入说说内容');

            const now = new Date();
            const timeStr = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;

            let data = JSON.parse(localStorage.getItem('blog-shuoshuo') || '[]');
            data.unshift({ text, img: img || null, time: timeStr });
            localStorage.setItem('blog-shuoshuo', JSON.stringify(data));
            
            document.getElementById('new-shuoshuo-text').value = '';
            document.getElementById('new-shuoshuo-img').value = '';
            renderShuoshuo();
            alert('发布成功！');
        }

        function addAlbum() {
            const img = document.getElementById('new-album-img').value.trim();
            const desc = document.getElementById('new-album-desc').value.trim();
            if (!img) return alert('请输入图片链接');

            let data = JSON.parse(localStorage.getItem('blog-album') || '[]');
            data.unshift({ src: img, desc: desc || '未命名图片' });
            localStorage.setItem('blog-album', JSON.stringify(data));

            document.getElementById('new-album-img').value = '';
            document.getElementById('new-album-desc').value = '';
            renderAlbum();
            alert('添加成功！');
        }

        // ============================================================
        // 3. 一言文案 API
        // ============================================================
        function fetchHitokoto() {
            const textElement = document.getElementById('hitokoto-text');
            if (!textElement) return;
            textElement.textContent = '正在获取文案...';
            fetch('https://v1.hitokoto.cn/')
                .then(response => response.json())
                .then(data => {
                    const source = data.from ? ` —— ${data.from}` : '';
                    textElement.textContent = `${data.hitokoto}${source}`;
                })
                .catch(error => {
                    textElement.textContent = '网络开小差了，点击重试~';
                });
        }

        // ============================================================
        // 4. 页面切换逻辑
        // ============================================================
        function switchTab(viewName) {
            ['home', 'shuoshuo', 'album', 'admin'].forEach(v => {
                const el = document.getElementById(v + '-view');
                if (el) { el.classList.add('hidden'); el.classList.remove('block'); }
            });
            const target = document.getElementById(viewName + '-view');
            if (target) { target.classList.remove('hidden'); target.classList.add('block'); }
            window.scrollTo({top: 0, behavior: 'smooth'});

            if (viewName === 'shuoshuo') renderShuoshuo();
            if (viewName === 'album') renderAlbum();
        }

        // ============================================================
        // 5. 其他交互逻辑
        // ============================================================
        function toggleWidget(e) {
            if (e) e.stopPropagation();
            const widget = document.getElementById('music-widget');
            if (widget.classList.contains('collapsed')) {
                widget.classList.remove('collapsed');
                widget.classList.add('expanded');
            } else {
                widget.classList.remove('expanded');
                widget.classList.add('collapsed');
            }
        }
        document.getElementById('music-widget').addEventListener('click', function(e) { e.stopPropagation(); });

        const htmlEl = document.documentElement;
        const themeToggleIcon = document.getElementById('theme-toggle');
        function applyTheme(isDark) {
            if (isDark) { htmlEl.classList.add('dark'); themeToggleIcon.classList.replace('fa-moon', 'fa-sun'); localStorage.setItem('blog-theme', 'dark'); }
            else { htmlEl.classList.remove('dark'); themeToggleIcon.classList.replace('fa-sun', 'fa-moon'); localStorage.setItem('blog-theme', 'light'); }
        }
        (function initTheme() {
            const saved = localStorage.getItem('blog-theme');
            if (saved === 'dark') applyTheme(true);
            else if (saved === 'light') applyTheme(false);
            else applyTheme(window.matchMedia('(prefers-color-scheme: dark)').matches);
        })();
        themeToggleIcon.addEventListener('click', () => applyTheme(!htmlEl.classList.contains('dark')));
        document.getElementById('settings-theme-toggle').addEventListener('click', () => applyTheme(!htmlEl.classList.contains('dark')));

        const settingsBtn = document.getElementById('settings-btn');
        const settingsPanel = document.getElementById('settings-panel');
        settingsBtn.addEventListener('click', () => settingsPanel.classList.toggle('hidden-panel'));
        document.getElementById('close-settings').addEventListener('click', () => settingsPanel.classList.add('hidden-panel'));
        document.addEventListener('click', (e) => { if (!settingsPanel.contains(e.target) && !settingsBtn.contains(e.target)) settingsPanel.classList.add('hidden-panel'); });

        document.addEventListener('DOMContentLoaded', () => {
            initData();
            fetchHitokoto();
            renderShuoshuo();
            renderAlbum();
        });
    </script>
</body>
</html>
