<!DOCTYPE html>
<html lang="zh-CN" class="">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>北宇的小站</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: { colors: { glass: { light: 'rgba(255,255,255,var(--card-opacity,0.75))', dark: 'rgba(30,30,40,var(--card-opacity,0.75))' } } } }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/styles/github-dark.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/aplayer/dist/APlayer.min.css">
    
    <!-- 自定义样式 -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="min-h-screen text-gray-800 dark:text-gray-100 p-4 md:p-8 transition-colors duration-500">

    <!-- 导航栏 -->
    <nav class="glass rounded-2xl max-w-6xl mx-auto px-6 py-4 flex flex-wrap justify-between items-center mb-8 sticky top-4 z-50">
        <div class="flex items-center space-x-3">
            <span id="site-name-display" class="text-xl font-bold tracking-wider">北宇的小站</span>
            <span id="visit-count" class="text-xs bg-blue-100 dark:bg-blue-900 text-blue-600 dark:text-blue-300 px-2 py-0.5 rounded-full hidden">访问量: 0</span>
        </div>
        <div class="hidden md:flex space-x-6 text-sm font-medium">
            <a href="#" onclick="switchTab('home')" class="text-blue-500 hover:text-blue-700 transition">首页</a>
            <a href="#" onclick="switchTab('articles')" class="hover:text-blue-500 transition">文章</a>
            <a href="#" onclick="switchTab('shuoshuo')" class="hover:text-blue-500 transition">说说</a>
            <a href="#" onclick="switchTab('album')" class="hover:text-blue-500 transition">相册</a>
        </div>
        <div class="flex space-x-4 items-center relative">
            <i id="theme-toggle" class="fas fa-moon cursor-pointer hover:text-blue-500 text-lg transition-colors"></i>
            <i id="settings-btn" class="fas fa-cog cursor-pointer hover:text-blue-500 text-lg transition-colors"></i>
            <div id="settings-panel" class="hidden-panel absolute right-0 top-12 w-72 glass rounded-2xl p-5 z-[60]">
                <div class="flex justify-between items-center mb-4">
                    <h4 class="font-bold text-sm uppercase tracking-wider text-gray-500 dark:text-gray-400">设置</h4>
                    <i id="close-settings" class="fas fa-times cursor-pointer text-gray-400 hover:text-gray-600 dark:hover:text-gray-200"></i>
                </div>
                <div class="space-y-4 text-sm">
                    <div class="flex justify-between items-center">
                        <span>暗色模式</span>
                        <button id="settings-theme-toggle" class="w-10 h-6 rounded-full bg-gray-300 dark:bg-blue-600 relative transition-colors duration-300">
                            <span class="absolute top-0.5 left-0.5 w-5 h-5 rounded-full bg-white shadow transition-transform duration-300 dark:translate-x-4"></span>
                        </button>
                    </div>
                    <div class="pt-2 border-t border-gray-200 dark:border-gray-700">
                        <button onclick="switchTab('admin')" class="w-full text-left text-blue-500 hover:text-blue-700 font-medium flex items-center">
                            <i class="fas fa-user-shield mr-2"></i> 后台管理
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <!-- 主内容区 -->
    <main class="max-w-6xl mx-auto">
        <!-- 首页视图 -->
        <div id="home-view" class="block">
            <div class="glass rounded-3xl p-6 flex flex-col items-center justify-center gap-4 mb-6 hover-lift">
                <img src="https://q1.qlogo.cn/g?b=qq&nk=1779180196&s=100" referrerpolicy="no-referrer" alt="QQ Avatar" class="w-24 h-24 rounded-full border-4 border-white/50 shadow-sm bg-white dark:bg-gray-800" loading="lazy">
                <div class="text-center">
                    <h2 class="text-2xl font-bold">北宇</h2>
                    <p class="text-gray-600 dark:text-gray-400 text-sm mt-1">在代码与学术间穿梭的普通人</p>
                </div>
            </div>
            <div onclick="fetchHitokoto()" title="点击刷新文案" class="glass-dark text-white rounded-3xl p-6 mb-8 flex items-start justify-between text-sm hover-lift cursor-pointer group">
                <div class="flex items-start flex-1 min-w-0">
                    <i class="fas fa-quote-left mr-3 mt-0.5 text-yellow-400 text-lg shrink-0"></i>
                    <span id="hitokoto-text" class="flex-1 break-words">正在获取今日文案...</span>
                </div>
                <i class="fas fa-sync-alt ml-3 mt-0.5 text-gray-400 group-hover:text-white group-hover:rotate-180 transition-all duration-500 shrink-0"></i>
            </div>
            <h3 class="text-xl font-bold mb-4 pl-2 border-l-4 border-blue-500">快捷入口</h3>
            <div class="grid grid-cols-3 gap-4">
                <div onclick="switchTab('articles')" class="glass rounded-3xl p-6 flex flex-col items-center justify-center hover-lift cursor-pointer group">
                    <div class="w-14 h-14 rounded-full bg-green-100 dark:bg-green-900 flex items-center justify-center mb-3 group-hover:scale-110 transition">
                        <i class="fas fa-book-open text-2xl text-green-500"></i>
                    </div>
                    <h4 class="font-bold text-base">文章</h4>
                    <p class="text-[10px] text-gray-500 dark:text-gray-400 mt-1 text-center">技术长文与思考</p>
                </div>
                <div onclick="switchTab('shuoshuo')" class="glass rounded-3xl p-6 flex flex-col items-center justify-center hover-lift cursor-pointer group">
                    <div class="w-14 h-14 rounded-full bg-blue-100 dark:bg-blue-900 flex items-center justify-center mb-3 group-hover:scale-110 transition">
                        <i class="fas fa-comment-dots text-2xl text-blue-500"></i>
                    </div>
                    <h4 class="font-bold text-base">说说</h4>
                    <p class="text-[10px] text-gray-500 dark:text-gray-400 mt-1 text-center">碎碎念与日常</p>
                </div>
                <div onclick="switchTab('album')" class="glass rounded-3xl p-6 flex flex-col items-center justify-center hover-lift cursor-pointer group">
                    <div class="w-14 h-14 rounded-full bg-purple-100 dark:bg-purple-900 flex items-center justify-center mb-3 group-hover:scale-110 transition">
                        <i class="fas fa-images text-2xl text-purple-500"></i>
                    </div>
                    <h4 class="font-bold text-base">相册</h4>
                    <p class="text-[10px] text-gray-500 dark:text-gray-400 mt-1 text-center">留住每个瞬间</p>
                </div>
            </div>
        </div>

        <!-- 文章列表视图 -->
        <div id="articles-view" class="hidden">
            <div class="flex items-center gap-4 mb-6">
                <button onclick="switchTab('home')" class="glass px-4 py-2 rounded-full flex items-center gap-2 hover:bg-white dark:hover:bg-gray-700 transition text-sm text-gray-600 dark:text-gray-300"><i class="fas fa-arrow-left"></i> 返回首页</button>
                <h3 class="text-xl font-bold pl-2 border-l-4 border-green-500">文章</h3>
            </div>
            <div id="articles-list" class="space-y-4"></div>
        </div>

        <!-- 文章详情视图 -->
        <div id="article-detail-view" class="hidden">
            <div class="flex items-center gap-4 mb-6">
                <button onclick="switchTab('articles')" class="glass px-4 py-2 rounded-full flex items-center gap-2 hover:bg-white dark:hover:bg-gray-700 transition text-sm text-gray-600 dark:text-gray-300"><i class="fas fa-arrow-left"></i> 返回文章列表</button>
            </div>
            <div class="glass rounded-3xl p-6 md:p-8">
                <h1 id="detail-title" class="text-3xl font-bold mb-4"></h1>
                <div class="flex items-center gap-4 text-xs text-gray-500 dark:text-gray-400 mb-6 border-b border-gray-200 dark:border-gray-700 pb-4">
                    <span><i class="fas fa-calendar-alt mr-1"></i> <span id="detail-time"></span></span>
                    <span><i class="fas fa-eye mr-1"></i> <span id="detail-views"></span> 阅读</span>
                    <span id="detail-tags"></span>
                </div>
                <div id="detail-content" class="markdown-body"></div>
            </div>
        </div>

        <!-- 说说视图 -->
        <div id="shuoshuo-view" class="hidden">
            <div class="flex items-center gap-4 mb-6">
                <button onclick="switchTab('home')" class="glass px-4 py-2 rounded-full flex items-center gap-2 hover:bg-white dark:hover:bg-gray-700 transition text-sm text-gray-600 dark:text-gray-300"><i class="fas fa-arrow-left"></i> 返回首页</button>
                <h3 class="text-xl font-bold pl-2 border-l-4 border-blue-500">说说</h3>
            </div>
            <div id="shuoshuo-list" class="space-y-4"></div>
        </div>

        <!-- 相册视图 -->
        <div id="album-view" class="hidden">
            <div class="flex items-center gap-4 mb-6">
                <button onclick="switchTab('home')" class="glass px-4 py-2 rounded-full flex items-center gap-2 hover:bg-white dark:hover:bg-gray-700 transition text-sm text-gray-600 dark:text-gray-300"><i class="fas fa-arrow-left"></i> 返回首页</button>
                <h3 class="text-xl font-bold pl-2 border-l-4 border-blue-500">相册</h3>
            </div>
            <div id="album-list" class="columns-1 sm:columns-2 md:columns-3 gap-4 space-y-4"></div>
        </div>

        <!-- 后台管理视图 -->
        <div id="admin-view" class="hidden">
            <div class="flex items-center gap-4 mb-6">
                <button onclick="switchTab('home')" class="glass px-4 py-2 rounded-full flex items-center gap-2 hover:bg-white dark:hover:bg-gray-700 transition text-sm text-gray-600 dark:text-gray-300"><i class="fas fa-arrow-left"></i> 返回首页</button>
                <h3 class="text-xl font-bold pl-2 border-l-4 border-red-500">后台管理</h3>
            </div>
            <!-- 登录模块 -->
            <div id="admin-login" class="glass rounded-3xl p-8 max-w-md mx-auto">
                <div class="text-center mb-6">
                    <svg class="w-32 h-32 mx-auto mb-4 text-gray-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4.5a4 4 0 1 0 0 8 4 4 0 1 0 0-8Z" /><path d="M4.5 20a7.5 7.5 0 0 1 15 0" /></svg>
                    <h4 class="text-lg font-bold">请输入管理员账号密码</h4>
                </div>
                <div class="space-y-4">
                    <input type="text" id="admin-username" placeholder="请输入账号" class="w-full glass border border-gray-300 dark:border-gray-600 rounded-xl px-4 py-3 outline-none focus:border-blue-500 transition bg-transparent">
                    <input type="password" id="admin-password" placeholder="请输入密码" class="w-full glass border border-gray-300 dark:border-gray-600 rounded-xl px-4 py-3 outline-none focus:border-blue-500 transition bg-transparent">
                    <button onclick="handleLogin()" class="w-full bg-blue-500 hover:bg-blue-600 text-white font-bold py-3 rounded-xl transition shadow-lg shadow-blue-500/30">登录后台</button>
                </div>
            </div>
            <!-- 管理主界面 -->
            <div id="admin-main" class="hidden">
                <h4 class="font-bold mb-4 pl-2 border-l-4 border-green-500 flex items-center"><i class="fas fa-cog mr-2"></i>全局设置</h4>
                <div class="glass rounded-3xl p-6 mb-8 space-y-6">
                    <div>
                        <label class="block text-sm font-bold mb-2 text-gray-700 dark:text-gray-300">站点名称</label>
                        <div class="flex flex-col sm:flex-row gap-3"><input type="text" id="setting-site-name" placeholder="如：北宇的小站" class="flex-1 glass border border-gray-300 dark:border-gray-600 rounded-xl px-3 py-2 outline-none focus:border-green-500 transition bg-transparent text-sm"><button onclick="saveSiteName()" class="bg-green-500 hover:bg-green-600 text-white font-bold px-6 py-2 rounded-xl transition text-sm shadow-md">保存名称</button></div>
                    </div>
                    <div>
                        <label class="block text-sm font-bold mb-2 text-gray-700 dark:text-gray-300">卡片透明度 (0-100)</label>
                        <div class="flex flex-col sm:flex-row gap-3 items-center"><input type="range" id="setting-opacity" min="0" max="100" value="75" class="flex-1 accent-green-500"><span id="opacity-value" class="text-sm font-mono bg-gray-200 dark:bg-gray-700 px-2 py-1 rounded">75%</span><button onclick="saveOpacity()" class="bg-green-500 hover:bg-green-600 text-white font-bold px-6 py-2 rounded-xl transition text-sm shadow-md">保存透明度</button></div>
                    </div>
                    <div>
                        <label class="block text-sm font-bold mb-2 text-gray-700 dark:text-gray-300">自定义背景图</label>
                        <div class="flex flex-col sm:flex-row gap-3"><input type="url" id="setting-bg-url" placeholder="输入图片链接" class="flex-1 glass border border-gray-300 dark:border-gray-600 rounded-xl px-3 py-2 outline-none focus:border-green-500 transition bg-transparent text-sm"><button onclick="saveBgSetting()" class="bg-green-500 hover:bg-green-600 text-white font-bold px-6 py-2 rounded-xl transition text-sm shadow-md">保存背景</button><button onclick="deleteBgSetting()" class="bg-red-500 hover:bg-red-600 text-white font-bold px-6 py-2 rounded-xl transition text-sm shadow-md">恢复默认</button></div>
                    </div>
                </div>

                <!-- 发布与修改区 -->
                <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
                    <!-- 文章表单 -->
                    <div class="glass rounded-3xl p-6">
                        <h4 class="font-bold mb-4 flex items-center justify-between"><span><i class="fas fa-book text-green-500 mr-2"></i><span id="article-form-title">发布文章</span></span><button id="cancel-article-btn" onclick="cancelEditArticle()" class="hidden text-xs bg-gray-200 dark:bg-gray-700 px-3 py-1 rounded-full">取消编辑</button></h4>
                        <input type="hidden" id="edit-article-id" value="">
                        <input type="text" id="new-article-title" placeholder="文章标题" class="w-full glass border border-gray-300 dark:border-gray-600 rounded-xl px-3 py-2 outline-none focus:border-green-500 transition bg-transparent mb-3 text-sm">
                        <input type="text" id="new-article-tags" placeholder="标签 (如：日常,代码，用逗号分隔)" class="w-full glass border border-gray-300 dark:border-gray-600 rounded-xl px-3 py-2 outline-none focus:border-green-500 transition bg-transparent mb-3 text-sm">
                        <textarea id="new-article-content" rows="8" placeholder="支持 Markdown 格式：# 标题、**加粗**、```代码块```" class="w-full glass border border-gray-300 dark:border-gray-600 rounded-xl p-3 outline-none focus:border-green-500 transition bg-transparent mb-4 resize-y font-mono text-sm"></textarea>
                        <button id="article-submit-btn" onclick="submitArticle()" class="w-full bg-green-500 hover:bg-green-600 text-white font-bold py-2 rounded-xl transition">立即发布</button>
                    </div>
                    <!-- 说说表单 -->
                    <div class="glass rounded-3xl p-6">
                        <h4 class="font-bold mb-4 flex items-center justify-between"><span><i class="fas fa-plus-circle text-blue-500 mr-2"></i><span id="shuoshuo-form-title">发布说说</span></span><button id="cancel-shuoshuo-btn" onclick="cancelEditShuoshuo()" class="hidden text-xs bg-gray-200 dark:bg-gray-700 px-3 py-1 rounded-full">取消编辑</button></h4>
                        <input type="hidden" id="edit-shuoshuo-id" value="">
                        <textarea id="new-shuoshuo-text" rows="3" placeholder="今天心情怎么样..." class="w-full glass border border-gray-300 dark:border-gray-600 rounded-xl p-3 outline-none focus:border-blue-500 transition bg-transparent mb-3 resize-none"></textarea>
                        <input type="text" id="new-shuoshuo-tags" placeholder="标签 (如：日常,代码，用逗号分隔)" class="w-full glass border border-gray-300 dark:border-gray-600 rounded-xl px-3 py-2 outline-none focus:border-blue-500 transition bg-transparent mb-3 text-sm">
                        <div class="flex gap-2 mb-4">
                            <input type="url" id="new-shuoshuo-img" placeholder="配图链接 (可选，也可以点击右侧上传)" class="flex-1 glass border border-gray-300 dark:border-gray-600 rounded-xl px-3 py-2 outline-none focus:border-blue-500 transition bg-transparent text-sm">
                            <label class="glass border border-gray-300 dark:border-gray-600 rounded-xl px-3 py-2 cursor-pointer hover:bg-white dark:hover:bg-gray-700 transition flex items-center justify-center shrink-0">
                                <i class="fas fa-upload text-blue-500"></i>
                                <input type="file" accept="image/*" class="hidden" onchange="uploadImage(this, 'new-shuoshuo-img')">
                            </label>
                        </div>
                        <button id="shuoshuo-submit-btn" onclick="submitShuoshuo()" class="w-full bg-blue-500 hover:bg-blue-600 text-white font-bold py-2 rounded-xl transition">立即发布</button>
                    </div>
                </div>

                <!-- 相册添加区 -->
                <div class="glass rounded-3xl p-6 mt-8">
                    <h4 class="font-bold mb-4 flex items-center justify-between"><span><i class="fas fa-image text-purple-500 mr-2"></i><span id="album-form-title">添加相册图片</span></span><button id="cancel-album-btn" onclick="cancelEditAlbum()" class="hidden text-xs bg-gray-200 dark:bg-gray-700 px-3 py-1 rounded-full">取消编辑</button></h4>
                    <input type="hidden" id="edit-album-id" value="">
                    <div class="flex flex-col sm:flex-row gap-3 mb-3">
                        <input type="url" id="new-album-img" placeholder="图片链接 (必填，也可以点击右侧上传)" class="flex-1 glass border border-gray-300 dark:border-gray-600 rounded-xl px-3 py-2 outline-none focus:border-purple-500 transition bg-transparent">
                        <label class="glass border border-gray-300 dark:border-gray-600 rounded-xl px-3 py-2 cursor-pointer hover:bg-white dark:hover:bg-gray-700 transition flex items-center justify-center shrink-0">
                            <i class="fas fa-upload text-purple-500"></i>
                            <input type="file" accept="image/*" class="hidden" onchange="uploadImage(this, 'new-album-img')">
                        </label>
                        <input type="text" id="new-album-desc" placeholder="图片描述" class="flex-1 glass border border-gray-300 dark:border-gray-600 rounded-xl px-3 py-2 outline-none focus:border-purple-500 transition bg-transparent">
                        <button id="album-submit-btn" onclick="submitAlbum()" class="bg-purple-500 hover:bg-purple-600 text-white font-bold px-6 py-2 rounded-xl transition">添加图片</button>
                    </div>
                </div>

                <h4 class="font-bold mt-10 mb-4 pl-2 border-l-4 border-red-500 flex items-center"><i class="fas fa-tasks mr-2"></i>内容管理</h4>
                <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                    <div class="glass rounded-3xl p-6"><h4 class="font-bold mb-4 flex items-center justify-between"><span><i class="fas fa-book text-green-500 mr-2"></i>管理文章</span></h4><div id="admin-article-list" class="space-y-3 max-h-[400px] overflow-y-auto pr-2"></div></div>
                    <div class="glass rounded-3xl p-6"><h4 class="font-bold mb-4 flex items-center justify-between"><span><i class="fas fa-comment text-blue-500 mr-2"></i>管理说说</span></h4><div id="admin-shuoshuo-list" class="space-y-3 max-h-[400px] overflow-y-auto pr-2"></div></div>
                    <div class="glass rounded-3xl p-6"><h4 class="font-bold mb-4 flex items-center justify-between"><span><i class="fas fa-image text-purple-500 mr-2"></i>管理相册</span></h4><div id="admin-album-list" class="space-y-3 max-h-[400px] overflow-y-auto pr-2"></div></div>
                </div>
                <div class="text-center mt-8"><button onclick="logout()" class="text-red-400 hover:text-red-500 text-sm font-medium"><i class="fas fa-sign-out-alt mr-1"></i> 退出登录</button></div>
            </div>
        </div>
    </main>

    <!-- 悬浮窗音乐播放器 -->
    <div id="music-widget" class="collapsed glass fixed right-4 bottom-20 cursor-pointer" onclick="toggleWidget(event)">
        <div class="collapsed-icon text-blue-500 dark:text-blue-400 text-2xl flex items-center justify-center"><i class="fas fa-music"></i></div>
        <div class="widget-content w-full">
            <div class="widget-header flex justify-between items-center px-4 pt-4 pb-2"><span class="text-xs font-bold text-gray-500 dark:text-gray-400 tracking-wider">CLOUD MUSIC</span><i class="fas fa-times cursor-pointer text-gray-400 hover:text-red-400 transition" onclick="toggleWidget(event)"></i></div>
            <div class="px-1 pb-1"><meting-js api="https://api.injahow.cn/meting/?server=:server&type=:type&id=:id" server="netease" type="playlist" id="3778678" fixed="false" mini="false" autoplay="false" theme="#3b82f6" loop="all" order="list" preload="auto" mutex="true" lrc-type="0"></meting-js></div>
        </div>
    </div>

    <!-- 核心依赖 -->
    <script src="https://cdn.jsdelivr.net/npm/aplayer/dist/APlayer.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/meting@2/dist/Meting.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/highlight.min.js"></script>

    <!-- 引入拆分好的脚本（加上版本号防止缓存） -->
    <script src="js/api.js?v=3"></script>
    <script src="js/main.js?v=3"></script>
    <script src="js/admin.js?v=3"></script>
</body>
</html>
