<!DOCTYPE html>
<html lang="zh-CN" class="">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>北宇的小站</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: { colors: { glass: { light: 'rgba(255,255,255,var(--card-opacity,0.75))', dark: 'rgba(30,30,40,var(--card-opacity,0.75))' } } } }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/aplayer/dist/APlayer.min.css">
    <script src="https://cdn.jsdelivr.net/npm/aplayer/dist/APlayer.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/meting@2/dist/Meting.min.js"></script>
    <style>
        :root {
            /* 默认卡片透明度 */
            --card-opacity: 0.75;
        }
        body {
            background-image: linear-gradient(rgba(0,0,0,0.15), rgba(0,0,0,0.15)), var(--custom-bg, url('https://images.unsplash.com/photo-1506744626753-1fa44f2ebd58?q=80&w=2000&auto=format&fit=crop'));
            background-size: cover; background-position: center; background-attachment: fixed;
            transition: background-image 0.5s ease;
        }
        html.dark body {
            background-image: linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.4)), var(--custom-bg, url('https://images.unsplash.com/photo-1470813740244-df37b8c1edcb?q=80&w=2000&auto=format&fit=crop'));
            background-color: #0f172a;
        }
        /* 使用 CSS 变量控制背景透明度，让效果更平滑 */
        .glass {
            background: rgba(255, 255, 255, var(--card-opacity));
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.12);
            transition: background 0.4s ease, border-color 0.4s ease, box-shadow 0.4s ease;
        }
        html.dark .glass {
            background: rgba(30, 30, 50, var(--card-opacity));
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
        }
        .glass-dark { background: rgba(30, 30, 30, calc(var(--card-opacity) + 0.05)); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.15); }
        html.dark .glass-dark { background: rgba(15, 15, 25, calc(var(--card-opacity) + 0.1)); }
        .hover-lift { transition: transform 0.3s ease, box-shadow 0.3s ease; }
        .hover-lift:hover { transform: translateY(-3px); box-shadow: 0 12px 40px 0 rgba(31, 38, 135, 0.2); }

        /* 悬浮窗核心样式（支持拖拽、吸附） */
        #music-widget { 
            transition: transform 0.3s ease, opacity 0.3s ease, background 0.4s ease, border-color 0.4s ease, box-shadow 0.4s ease;
            transform-origin: bottom right; 
            overflow: hidden; 
            cursor: grab;
            user-select: none;
            z-index: 999;
        }
        #music-widget:active { cursor: grabbing; }
        #music-widget.collapsed { 
            width: 56px; height: 56px; border-radius: 50%; padding: 0; 
            display: flex; align-items: center; justify-content: center; 
            opacity: 0.9; 
        }
        #music-widget.collapsed:hover { opacity: 1; }
        #music-widget.collapsed .widget-header { display: none !important; }
        #music-widget.collapsed .widget-content { display: none !important; }
        #music-widget.collapsed .aplayer { display: none !important; }
        #music-widget.collapsed .collapsed-icon { display: block; }

        #music-widget.expanded { width: 85vw; max-width: 350px; height: auto; border-radius: 1.5rem; padding: 0.5rem; }
        #music-widget.expanded .widget-header { display: flex; }
        #music-widget.expanded .widget-content { display: block; }
        #music-widget.expanded .collapsed-icon { display: none; }

        /* APlayer 美化 */
        .aplayer { background: transparent !important; color: #333 !important; font-family: inherit !important; margin: 0 !important; width: 100% !important; }
        html.dark .aplayer { color: #e2e8f0 !important; }
        .aplayer .aplayer-info { border-bottom: none !important; padding: 10px 15px 0 15px !important; }
        .aplayer .aplayer-info .aplayer-music .aplayer-title { font-size: 15px !important; font-weight: bold !important; }
        .aplayer .aplayer-list { max-height: 200px !important; overflow-y: auto !important; margin-top: 5px !important; border-top: 1px solid rgba(150,150,150,0.2) !important; }
        .aplayer .aplayer-list ol li { border-top: none !important; border-bottom: 1px solid rgba(150,150,150,0.1) !important; font-size: 12px !important; padding: 8px 15px !important; }
        .aplayer .aplayer-list ol li.aplayer-list-light { background: rgba(59, 130, 246, 0.15) !important; }
        html.dark .aplayer .aplayer-list ol li.aplayer-list-light { background: rgba(59, 130, 246, 0.3) !important; }
        .aplayer .aplayer-list ol li:hover { background: rgba(255,255,255,0.5) !important; }
        html.dark .aplayer .aplayer-list ol li:hover { background: rgba(255,255,255,0.1) !important; }

        #settings-panel { transition: opacity 0.3s ease, transform 0.3s ease; }
        #settings-panel.hidden-panel { opacity: 0; transform: translateY(-10px); pointer-events: none; }
    </style>
</head>

                    fixed="false" mini="false" autoplay="false" theme="#3b82f6" loop="all" order="list" preload="auto" mutex="true" lrc-type="0">

            </div>

    <script>
        // ============================================================
        // 1. 悬浮球拖拽与吸附逻辑
        // ============================================================
        const widget = document.getElementById('music-widget');
        let isDragging = false;
        let isMoved = false; // 用于区分点击和拖拽
        let startX, startY, startLeft, startTop;

        function getClientX(e) { return e.type.includes('mouse') ? e.clientX : e.touches[0].clientX; }
        function getClientY(e) { return e.type.includes('mouse') ? e.clientY : e.touches[0].clientY; }

        function dragStart(e) {
            // 如果点击的是悬浮窗内部的按钮或输入框，不触发拖拽
            if (e.target.closest('.widget-content') && !e.target.closest('.widget-header')) return;
            
            isDragging = true;
            isMoved = false;
            const clientX = getClientX(e);
            const clientY = getClientY(e);
            
            const rect = widget.getBoundingClientRect();
            startX = clientX;
            startY = clientY;
            startLeft = rect.left;
            startTop = rect.top;

            widget.style.transition = 'none';
            // 切换定位方式为 left/top，方便拖拽计算
            widget.style.right = 'auto';
            widget.style.bottom = 'auto';
            widget.style.left = startLeft + 'px';
            widget.style.top = startTop + 'px';
        }

        function dragMove(e) {
            if (!isDragging) return;
            const clientX = getClientX(e);
            const clientY = getClientY(e);

            const dx = clientX - startX;
            const dy = clientY - startY;
            
            // 如果移动距离超过 5px，判定为拖拽，取消点击事件
            if (Math.abs(dx) > 5 || Math.abs(dy) > 5) {
                isMoved = true;
            }

            let newLeft = startLeft + dx;
            let newTop = startTop + dy;

            // 限制不能拖出屏幕
            const maxX = window.innerWidth - widget.offsetWidth;
            const maxY = window.innerHeight - widget.offsetHeight;
            newLeft = Math.max(0, Math.min(newLeft, maxX));
            newTop = Math.max(0, Math.min(newTop, maxY));

            widget.style.left = newLeft + 'px';
            widget.style.top = newTop + 'px';
            
            if (e.cancelable) e.preventDefault(); // 防止移动端拖拽时触发页面滚动
        }

        function dragEnd(e) {
            if (!isDragging) return;
            isDragging = false;
            widget.style.transition = 'all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275)'; // 恢复平滑动画

            const rect = widget.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            
            // 吸附逻辑
            if (centerX < window.innerWidth / 2) {
                // 吸附左侧
                widget.style.left = '20px';
            } else {
                // 吸附右侧
                widget.style.left = (window.innerWidth - rect.width - 20) + 'px';
            }
            // 纵向位置保持松手时的位置，如果希望纵向也吸附底部，可以追加逻辑（这里保留自由纵向位置）
        }

        // 绑定事件（同时兼容鼠标和触摸）
        widget.addEventListener('mousedown', dragStart);
        document.addEventListener('mousemove', dragMove);
        document.addEventListener('mouseup', dragEnd);
        widget.addEventListener('touchstart', dragStart, { passive: false });
        document.addEventListener('touchmove', dragMove, { passive: false });
        document.addEventListener('touchend', dragEnd);

        // 点击展开/收起逻辑
        function toggleWidget(e) {
            if (e) e.stopPropagation();
            if (isMoved) return; // 如果是拖拽，不触发展开收起
            const widget = document.getElementById('music-widget');
            if (widget.classList.contains('collapsed')) {
                widget.classList.remove('collapsed');
                widget.classList.add('expanded');
            } else {
                widget.classList.remove('expanded');
                widget.classList.add('collapsed');
            }
        }

        // 3. 后台设置逻辑

        async function loadSiteSettings() {
            // 站点名称
            try {
                const resName = await fetch('/api/settings?key=site_name');
                const dataName = await resName.json();
                if (dataName && dataName.value) {
                    document.getElementById('site-name-display').textContent = dataName.value;
                }
            } catch(e) {}
            
            // 卡片透明度
            try {
                const resOp = await fetch('/api/settings?key=card_opacity');
                const dataOp = await resOp.json();
                if (dataOp && dataOp.value) {
                    document.documentElement.style.setProperty('--card-opacity', dataOp.value);
                    document.getElementById('setting-opacity').value = Math.round(dataOp.value * 100);
                    document.getElementById('opacity-value').textContent = Math.round(dataOp.value * 100) + '%';
                }
            } catch(e) {}
        }

        // 滑块实时显示数值
        document.getElementById('setting-opacity').addEventListener('input', (e) => {
            document.getElementById('opacity-value').textContent = e.target.value + '%';
            document.documentElement.style.setProperty('--card-opacity', e.target.value / 100);
        });

        async function saveSiteName() {
            const url = document.getElementById('setting-site-name').value.trim();
            if (!url) return alert('请输入站点名称！');
            try {
                await fetch('/api/settings?key=site_name', {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ value: url })
                });
                alert('站点名称保存成功！');
                document.getElementById('site-name-display').textContent = url;
            } catch (e) { alert('保存失败'); }
        }

        async function saveOpacity() {
            const val = document.getElementById('setting-opacity').value / 100;
            try {
                await fetch('/api/settings?key=card_opacity', {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ value: val })
                });
                alert('透明度保存成功！');
            } catch (e) { alert('保存失败'); }
        }

        async function loadBackground() {
            try {
                const res = await fetch('/api/settings?key=background_image');
                const data = await res.json();
                if (data && data.value) {
                    document.documentElement.style.setProperty('--custom-bg', `url('${data.value}')`);
                }
            } catch (e) {}
        }

        async function saveBgSetting() {
            const url = document.getElementById('setting-bg-url').value.trim();
            if (!url) return alert('请输入图片链接！');
            try {
                await fetch('/api/settings?key=background_image', {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ value: url })
                });
                alert('背景图保存成功！');
                document.getElementById('setting-bg-url').value = '';
                loadBackground();
            } catch (e) { alert('保存失败'); }
        }

        async function deleteBgSetting() {
            if (!confirm('确定要恢复默认背景图吗？')) return;
            try {
                await fetch('/api/settings?key=background_image', { method: 'DELETE' });
                alert('已恢复默认背景！');
                document.documentElement.style.removeProperty('--custom-bg');
            } catch (e) { alert('操作失败'); }
        }
