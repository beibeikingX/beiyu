    <style>
        :root { --card-opacity: 0.75; }
        body {
            background-image: linear-gradient(rgba(0,0,0,0.15), rgba(0,0,0,0.15)), var(--custom-bg, url('https://images.unsplash.com/photo-1506744626753-1fa44f2ebd58?q=80&w=2000&auto=format&fit=crop'));
            background-size: cover; background-position: center; background-attachment: fixed;
            transition: background-image 0.5s ease;
        }
        html.dark body {
            background-image: linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.4)), var(--custom-bg, url('https://images.unsplash.com/photo-1470813740244-df37b8c1edcb?q=80&w=2000&auto=format&fit=crop'));
            background-color: #0f172a;
        }
        .glass {
            background: rgba(255, 255, 255, var(--card-opacity));
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.12);
            transition: background 0.4s ease, border-color 0.4s ease, box-shadow 0.4s ease;
        }
        html.dark .glass {
            background: rgba(30, 30, 50, var(--card-opacity));
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
        }
        .glass-dark { background: rgba(30, 30, 30, calc(var(--card-opacity) + 0.05)); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.15); }
        html.dark .glass-dark { background: rgba(15, 15, 25, calc(var(--card-opacity) + 0.1)); }
        .hover-lift { transition: transform 0.3s ease, box-shadow 0.3s ease; }
        .hover-lift:hover { transform: translateY(-3px); box-shadow: 0 12px 40px 0 rgba(31, 38, 135, 0.2); }

        /* 骨架屏动画 */
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .5; } }
        .skeleton { animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; background-color: rgba(200, 200, 200, 0.5); border-radius: 8px; }

        /* 悬浮窗 */
        #music-widget { transition: transform 0.3s ease, opacity 0.3s ease, background 0.4s ease; transform-origin: bottom right; overflow: hidden; cursor: grab; user-select: none; z-index: 999; }
        #music-widget:active { cursor: grabbing; }
        #music-widget.collapsed { width: 56px; height: 56px; border-radius: 50%; padding: 0; display: flex; align-items: center; justify-content: center; opacity: 0.9; }
        #music-widget.collapsed:hover { opacity: 1; }
        #music-widget.collapsed .widget-header, #music-widget.collapsed .widget-content, #music-widget.collapsed .aplayer { display: none !important; }
        #music-widget.collapsed .collapsed-icon { display: block; }
        #music-widget.expanded { width: 85vw; max-width: 350px; height: auto; border-radius: 1.5rem; padding: 0.5rem; }
        #music-widget.expanded .widget-header, #music-widget.expanded .widget-content { display: block; }
        #music-widget.expanded .collapsed-icon { display: none; }

        .aplayer { background: transparent !important; color: #333 !important; font-family: inherit !important; margin: 0 !important; width: 100% !important; }
        html.dark .aplayer { color: #e2e8f0 !important; }
        .aplayer .aplayer-info { border-bottom: none !important; padding: 10px 15px 0 15px !important; }
        .aplayer .aplayer-list { max-height: 200px !important; overflow-y: auto !important; margin-top: 5px !important; border-top: 1px solid rgba(150,150,150,0.2) !important; }
        .aplayer .aplayer-list ol li { border-top: none !important; border-bottom: 1px solid rgba(150,150,150,0.1) !important; font-size: 12px !important; padding: 8px 15px !important; }

        #settings-panel { transition: opacity 0.3s ease, transform 0.3s ease; }
        #settings-panel.hidden-panel { opacity: 0; transform: translateY(-10px); pointer-events: none; }
    </style>
</head>

    <script>
        const API_TOKEN = 'my-secret-token-123'; 
        const authHeaders = { 'Authorization': `Bearer ${API_TOKEN}` };

        // ============================================================
        // 0. 图片压缩与 ImgBB 上传功能
        // ============================================================
        
        // 压缩图片函数
        function compressImage(file, maxWidth = 1200, quality = 0.8) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (event) => {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let width = img.width;
                        let height = img.height;
                        if (width > maxWidth) {
                            height = Math.round((height * maxWidth) / width);
                            width = maxWidth;
                        }
                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        canvas.toBlob((blob) => {
                            resolve(blob);
                        }, 'image/jpeg', quality);
                    };
                };
            });
        }

        async function uploadImage(inputElement, targetInputId) {
            const file = inputElement.files[0];
            if (!file) return;

            const targetInput = document.getElementById(targetInputId);
            const originalPlaceholder = targetInput.placeholder;
            targetInput.placeholder = '图片压缩中...';
            targetInput.disabled = true;

            try {
                // 1. 压缩图片
                const compressedBlob = await compressImage(file);
                targetInput.placeholder = '图片上传中，请稍候...';

                // 2. 转为 Base64
                const base64Data = await new Promise((resolve, reject) => {
                    const reader = new FileReader();
                    reader.readAsDataURL(compressedBlob);
                    reader.onloadend = () => resolve(reader.result.split(',')[1]);
                    reader.onerror = reject;
                });

                // 3. 发送给后端 API（由 Cloudflare Worker 转发给 ImgBB）
                const res = await fetch('/api/upload', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', ...authHeaders },
                    body: JSON.stringify({ image: base64Data })
                });
                const data = await res.json();
                
                if (data.success && data.url) {
                    targetInput.value = data.url;
                    alert('图片上传成功！');
                } else {
                    throw new Error(data.error || '上传失败');
                }
            } catch (e) {
                alert('上传失败：' + e.message);
            } finally {
                targetInput.placeholder = originalPlaceholder;
                targetInput.disabled = false;
                inputElement.value = ''; // 清空 file input
            }
        }

        // ============================================================

        const widget = document.getElementById('music-widget'); let isDragging = false; let isMoved = false; let startX, startY, startLeft, startTop;
        function getClientX(e) { return e.type.includes('mouse') ? e.clientX : e.touches[0].clientX; }
        function getClientY(e) { return e.type.includes('mouse') ? e.clientY : e.touches[0].clientY; }
        function dragStart(e) {
            if (e.target.closest('.widget-content') && !e.target.closest('.widget-header')) return;
            isDragging = true; isMoved = false; const clientX = getClientX(e); const clientY = getClientY(e);
            const rect = widget.getBoundingClientRect(); startX = clientX; startY = clientY; startLeft = rect.left; startTop = rect.top;
            widget.style.transition = 'none'; widget.style.right = 'auto'; widget.style.bottom = 'auto'; widget.style.left = startLeft + 'px'; widget.style.top = startTop + 'px';
        }
        function dragMove(e) {
            if (!isDragging) return; const clientX = getClientX(e); const clientY = getClientY(e);
            const dx = clientX - startX; const dy = clientY - startY; if (Math.abs(dx) > 5 || Math.abs(dy) > 5) isMoved = true;
            let newLeft = startLeft + dx; let newTop = startTop + dy;
            const maxX = window.innerWidth - widget.offsetWidth; const maxY = window.innerHeight - widget.offsetHeight;
            newLeft = Math.max(0, Math.min(newLeft, maxX)); newTop = Math.max(0, Math.min(newTop, maxY));
            widget.style.left = newLeft + 'px'; widget.style.top = newTop + 'px'; if (e.cancelable) e.preventDefault();
        }
        function dragEnd(e) {
            if (!isDragging) return; isDragging = false; widget.style.transition = 'all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275)';
            const rect = widget.getBoundingClientRect(); const centerX = rect.left + rect.width / 2;
            if (centerX < window.innerWidth / 2) { widget.style.left = '20px'; } else { widget.style.left = (window.innerWidth - rect.width - 20) + 'px'; }
        }
        widget.addEventListener('mousedown', dragStart); document.addEventListener('mousemove', dragMove); document.addEventListener('mouseup', dragEnd);
        widget.addEventListener('touchstart', dragStart, { passive: false }); document.addEventListener('touchmove', dragMove, { passive: false }); document.addEventListener('touchend', dragEnd);
        function toggleWidget(e) { if (e) e.stopPropagation(); if (isMoved) return; const widget = document.getElementById('music-widget'); if (widget.classList.contains('collapsed')) { widget.classList.remove('collapsed'); widget.classList.add('expanded'); } else { widget.classList.remove('expanded'); widget.classList.add('collapsed'); } }

        const htmlEl = document.documentElement; const themeToggleIcon = document.getElementById('theme-toggle');
        function applyTheme(isDark) { if (isDark) { htmlEl.classList.add('dark'); themeToggleIcon.classList.replace('fa-moon', 'fa-sun'); localStorage.setItem('blog-theme', 'dark'); } else { htmlEl.classList.remove('dark'); themeToggleIcon.classList.replace('fa-sun', 'fa-moon'); localStorage.setItem('blog-theme', 'light'); } }
        (function initTheme() { const saved = localStorage.getItem('blog-theme'); if (saved === 'dark') applyTheme(true); else if (saved === 'light') applyTheme(false); else applyTheme(window.matchMedia('(prefers-color-scheme: dark)').matches); })();
        themeToggleIcon.addEventListener('click', () => applyTheme(!htmlEl.classList.contains('dark')));
        document.getElementById('settings-theme-toggle').addEventListener('click', () => applyTheme(!htmlEl.classList.contains('dark')));
        const settingsBtn = document.getElementById('settings-btn'); const settingsPanel = document.getElementById('settings-panel');
        settingsBtn.addEventListener('click', () => settingsPanel.classList.toggle('hidden-panel'));
        document.getElementById('close-settings').addEventListener('click', () => settingsPanel.classList.add('hidden-panel'));
        document.addEventListener('click', (e) => { if (!settingsPanel.contains(e.target) && !settingsBtn.contains(e.target)) settingsPanel.classList.add('hidden-panel'); });

        document.addEventListener('DOMContentLoaded', () => { loadSiteSettings(); loadBackground(); fetchHitokoto(); renderShuoshuo(); renderAlbum(); recordVisit(); });
    </script>
</body>
</html>
